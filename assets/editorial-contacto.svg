<text x="81" y="62" class="headline" font-size="43">Contacto</text>
<path d="M430 57H915m-22-10h22" stroke="#e7d6b8" opacity=".65"/>
<path class="frame" opacity=".8" d="M18 7H939l13 10v57l-11 11H19L7 74V19Z"/>
<path d="M8 44l18-28 28-8M907 85l38-15 8-18" stroke="#f7f0dc" fill="none" opacity=".45"/>
</svg>